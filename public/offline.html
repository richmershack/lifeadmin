<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LifeAdmin offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f4;
        color: #17211f;
      }

      main {
        width: min(420px, calc(100vw - 36px));
        border: 1px solid #dfe5df;
        border-radius: 12px;
        padding: 24px;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0;
        color: #68726f;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LifeAdmin is offline</h1>
      <p>Reconnect to the internet to view your saved documents, reminders, and dashboard.</p>
    </main>
  </body>
</html>
